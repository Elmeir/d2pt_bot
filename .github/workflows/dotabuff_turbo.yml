name: dotabuff turbo

# 每日更新 Dotabuff Turbo 模式英雄 Meta 数据 data/dotabuff_turbo.json
# - 定时：每日 UTC 0:30 运行（北京时间 8:30）
# - 手动：支持在 GitHub Actions 页面手动触发
on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch script
        run: python fetch_dotabuff_turbo.py

      - name: Commit and push
        uses: ./.github/actions/commit-push
        with:
          files: data/dotabuff_turbo.json
