name: d2pt win rate

# 每小时更新一次各位置的胜率数据 d2pt_pos.json
# - 定时：每小时第 23 分钟运行
# - 手动：支持在 GitHub Actions 页面手动触发
on:
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

jobs:
  fetch-stats:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run fetch script
        run: python fetch_d2pt.py

      - name: Commit and push
        uses: ./.github/actions/commit-push
        with:
          files: data/d2pt_pos*.json
