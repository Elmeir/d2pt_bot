name: d2pt core build

# 每日检查并按版本节奏更新 d2pt_core_build.json
# - 节奏：新版本更新后第 1 周每天、第 2 周每 2 天、之后每 3 天
#   （数据源 data/patch_date.json，由 patch_date.yml 每日维护）
# - 定时：每日 UTC 0:20 运行，未到更新时间时脚本自行跳过
# - 手动：支持在 GitHub Actions 页面手动触发，始终执行
on:
  schedule:
    - cron: '20 0 * * *'
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # CI 环境无 SOCKS5 代理，禁用代理直连
      D2PT_PROXY: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch script
        env:
          # 仅定时触发时按版本节奏门控，手动触发始终执行
          D2PT_EVENT: ${{ github.event_name }}
        run: python fetch_d2pt_build.py

      - name: Commit and push
        uses: ./.github/actions/commit-push
        with:
          files: data/d2pt_core_build.json
