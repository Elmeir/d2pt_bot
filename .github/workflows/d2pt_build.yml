name: d2pt core build

# 每 7 天自动更新一次 d2pt_core_build.json
# - 定时：每周日 UTC 0:20 运行（即每周一次）
# - 手动：支持在 GitHub Actions 页面手动触发
on:
  schedule:
    - cron: '20 0 * * 0'
  workflow_dispatch:

jobs:
  update-database:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      # CI 环境无 SOCKS5 代理，禁用代理直连
      D2PT_PROXY: ""
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run fetch script
        run: python fetch_d2pt_build.py

      - name: Commit and push
        uses: ./.github/actions/commit-push
        with:
          files: d2pt_core_build.json
